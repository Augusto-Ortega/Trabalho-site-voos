<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Compras</title>
    <link rel="stylesheet" href="../css/PaginaPagamento.css"> <!-- Link para o CSS caso tenha -->
</head>
<body>
    <div class="container">
        <h1>Minhas Compras</h1>
        <button id="carregar-compras" onclick="loadCompras()">Carregar Compras</button> <!-- Botão para carregar compras -->
        <div id="compras-list"></div>
    </div>

    <script>
        // Substitua 'emailDoUsuarioLogado' pelo e-mail do usuário logado
        const userId = '123@123.com'; // Exemplo de e-mail do usuário logado

        // Função para carregar as compras do usuário
        function loadCompras() {
            fetch(`/minhas-compras/${userId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Erro na resposta da rede.");
                    }
                    return response.json();
                })
                .then(data => {
                    const comprasList = document.getElementById("compras-list");
                    comprasList.innerHTML = ''; // Limpa a lista antes de adicionar novas compras
                    if (data.length === 0) {
                        comprasList.innerHTML = "<p>Nenhuma compra encontrada.</p>";
                    } else {
                        data.forEach(compra => {
                            const compraItem = document.createElement("div");
                            compraItem.innerHTML = `
                                <strong>Detalhes da Compra:</strong><br>
                                Usuário: ${compra['Usuário']}<br>
                                Origem: ${compra['Origem']}<br>
                                Destino: ${compra['Destino']}<br>
                                Data: ${compra['Data']}<br>
                                Preço: ${compra['Preço']}<br>
                                Nome no Cartão: ${compra['Nome no Cartão']}<br>
                                Número do Cartão: ${compra['Número do Cartão']}<br>
                                Chave Pix: ${compra['Chave Pix']}<br>
                                <hr>
                            `;
                            comprasList.appendChild(compraItem);
                        });
                    }
                })
                .catch(error => console.error("Erro ao carregar as compras:", error));
        }

        // Chama a função para carregar as compras ao carregar a página, se necessário
        // window.onload = loadCompras; // Descomente se quiser carregar automaticamente
    </script>
</body>
</html>
