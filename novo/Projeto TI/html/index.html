<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles3.css">
    <title>Busca de Voos</title>
    <script src="../js/voos.js"></script>
    <script>
        // Função de busca de voos
        function buscarVoos(origemBusca, destinoBusca, dataBusca) {
            let resultados = voos.filter(voo => {
                // Comparação de origem e destino
                let condicaoOrigemDestino = voo.origem.toLowerCase() === origemBusca.toLowerCase() &&
                                            voo.destino.toLowerCase() === destinoBusca.toLowerCase();

                // Se a data for especificada, inclui também a comparação de datas
                if (dataBusca) {
                    return condicaoOrigemDestino && voo.data === dataBusca;
                }

                // Se a data não for especificada, retorna apenas pela origem e destino
                return condicaoOrigemDestino;
            });

            return resultados;
        }

        // Função para exibir os resultados na página
        function exibirResultados() {
            const origemInput = document.getElementById("origem").value;
            const destinoInput = document.getElementById("destino").value;
            const dataInput = document.getElementById("data").value;

            // Chama a função de busca com os valores fornecidos
            const resultados = buscarVoos(origemInput, destinoInput, dataInput);

            const resultadosDiv = document.getElementById("resultados");
            resultadosDiv.innerHTML = "";

            if (resultados.length > 0) {
                resultados.forEach(voo => {
                    const vooElement = document.createElement("div");
                    vooElement.classList.add("voo-item"); // Adiciona uma classe para estilização
                    vooElement.innerHTML = `
                        <p><strong>Origem:</strong> ${voo.origem}</p>
                        <p><strong>Destino:</strong> ${voo.destino}</p>
                        <p><strong>Data:</strong> ${voo.data}</p>
                        <p><strong>Horário:</strong> ${voo.horario}</p>
                        <p><strong>Preço:</strong> R$${voo.preco.toFixed(2)}</p>
                        <hr>
                    `;
                    
                    // Adiciona o evento de clique para redirecionar
                    vooElement.onclick = function() {
                        // Salve informações sobre o voo, se necessário
                        localStorage.setItem('vooSelecionado', JSON.stringify(voo));
                        window.location.href = '../html/SalaPagamento.html'; // Redireciona para a página de pagamento
                    };

                    resultadosDiv.appendChild(vooElement);
                });
            } else {
                resultadosDiv.innerHTML = "<p>Nenhum voo encontrado.</p>";
            }
        }
    </script>
</head>
<body>
    <h1><a href="Login.html">Clique aqui para fazer login</a></h1>
    <h1>Busca de Voos</h1>
    <form onsubmit="event.preventDefault(); exibirResultados();">
        <label for="origem">Origem:</label>
        <input type="text" id="origem" required>
        <br><br>
        <label for="destino">Destino:</label>
        <input type="text" id="destino" required>
        <br><br>
        <label for="data">Data (opcional):</label>
        <input type="date" id="data">
        <br><br>
        <button type="submit">Buscar Voos</button>
        
    </form>
    <h2>Resultados:</h2>
    <div id="resultados"></div>
    <!-- Botão de Logout -->
<button id="logoutButton" onclick="logout()">Logout</button>

<!-- JavaScript para o logout e estilo do botão -->
<script>
    // Função de logout
    function logout() {
        // Remove o estado de login do localStorage
        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("userId"); // Opcional, se estiver usando o userId

        // Redireciona o usuário para a página de login
        window.location.href = "Login.html";
    }

    // Estilos do botão de logout
    const logoutButton = document.getElementById("logoutButton");
    logoutButton.style.position = "fixed";
    logoutButton.style.bottom = "20px";
    logoutButton.style.right = "20px";
    logoutButton.style.padding = "10px 20px";
    logoutButton.style.backgroundColor = "#ff4b4b";
    logoutButton.style.color = "#fff";
    logoutButton.style.border = "none";
    logoutButton.style.borderRadius = "5px";
    logoutButton.style.cursor = "pointer";
    logoutButton.style.fontSize = "16px";

    logoutButton.addEventListener("mouseover", () => {
        logoutButton.style.backgroundColor = "#ff6666";
    });
    logoutButton.addEventListener("mouseout", () => {
        logoutButton.style.backgroundColor = "#ff4b4b";
    });
</script>

</body>
</html>
